services:
  zcode2api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:6789:6789"
      - "127.0.0.1:6780:6780"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
