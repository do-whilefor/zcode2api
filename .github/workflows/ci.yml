name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test backend
        run: go test -count=1 ./...

      - name: Test frontend
        run: node --test test/*.test.mjs

      - name: Test Windows startup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -trimpath -o bin/zcode2api-smoke.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./test/startup.test.ps1 -BinaryPath ./bin/zcode2api-smoke.exe

      - name: Build
        run: go build -trimpath ./...
